name: release-tag

# Tags vX.Y.Z when a release/x.y.z pull request is merged into main, so this
# repository carries the same product version as the applications (which tag in
# their deploy.yml). Nothing is deployed from this workflow.
# Release process: qeet-id-kit docs/release-process.md.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the tag and create the GitHub release
  pull-requests: read # find the merged release/x.y.z pull request

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # existing tags

      - name: Version from the merged release branch
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .head.ref][0] // ""')
          if ! [[ $head =~ ^release/([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Not a release/x.y.z merge (${head:-direct push}); nothing to tag."
            exit 0
          fi
          tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          if [ -n "$latest" ] && [ "$(printf '%s\n' "${latest#v}" "${tag#v}" | sort -V | tail -1)" != "${tag#v}" ]; then
            echo "::error::$head is not newer than $latest"
            exit 1
          fi
          echo "Latest: ${latest:-none}  ->  new: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push tag and create GitHub release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
